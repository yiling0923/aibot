<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1056" width="960" height="1056" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6b7a"/></marker></defs><rect width="960" height="1056" fill="#ffffff"/><text x="480" y="22" text-anchor="middle" font-size="13" fill="#5b6b7a">Customer message arrives. The first step that fits decides the reply.</text><rect x="20" y="40" width="470" height="66" rx="10" fill="#f4f6f8" stroke="#c5d0d9" stroke-width="1.4"/><circle cx="46" cy="73.0" r="14" fill="#0E7C86"/><text x="46" y="78.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text x="72" y="78.0" font-size="14" font-weight="600" fill="#1c2530">Rude words?</text><line x1="255" y1="106" x2="255" y2="126" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="270" y="120" text-anchor="middle" font-size="11" fill="#5b6b7a">no</text><line x1="490" y1="73.0" x2="520" y2="73.0" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="505" y="65.0" text-anchor="middle" font-size="11" fill="#5b6b7a">yes</text><rect x="522" y="40" width="418" height="66" rx="10" fill="#fdf0d4" stroke="#a86500" stroke-width="1.4"/><text x="538" y="65" font-size="15" font-weight="700" fill="#a86500">ABUSE</text><text x="538" y="83" font-size="12.5" fill="#1c2530">Kind reply first. The chat closes only after N rude</text><text x="538" y="98" font-size="12.5" fill="#1c2530">messages (default 3).</text><rect x="20" y="126" width="470" height="66" rx="10" fill="#f4f6f8" stroke="#c5d0d9" stroke-width="1.4"/><circle cx="46" cy="159.0" r="14" fill="#0E7C86"/><text x="46" y="164.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text x="72" y="155.0" font-size="14" font-weight="600" fill="#1c2530">Safety rules: rule changes, another merchant,</text><text x="72" y="173.0" font-size="14" font-weight="600" fill="#1c2530">asking for a secret or for a person</text><line x1="255" y1="192" x2="255" y2="212" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="270" y="206" text-anchor="middle" font-size="11" fill="#5b6b7a">no</text><line x1="490" y1="159.0" x2="520" y2="159.0" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="505" y="151.0" text-anchor="middle" font-size="11" fill="#5b6b7a">yes</text><rect x="522" y="126" width="418" height="66" rx="10" fill="#fadedb" stroke="#b3372c" stroke-width="1.4"/><text x="538" y="151" font-size="15" font-weight="700" fill="#b3372c">HANDOFF or REFUSE</text><text x="538" y="169" font-size="12.5" fill="#1c2530">Secrets are refused politely. The rest goes to a</text><text x="538" y="184" font-size="12.5" fill="#1c2530">human.</text><rect x="20" y="212" width="470" height="66" rx="10" fill="#f4f6f8" stroke="#c5d0d9" stroke-width="1.4"/><circle cx="46" cy="245.0" r="14" fill="#0E7C86"/><text x="46" y="250.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text x="72" y="250.0" font-size="14" font-weight="600" fill="#1c2530">Greeting, thanks, calling out, or only filler words?</text><line x1="255" y1="278" x2="255" y2="298" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="270" y="292" text-anchor="middle" font-size="11" fill="#5b6b7a">no</text><line x1="490" y1="245.0" x2="520" y2="245.0" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="505" y="237.0" text-anchor="middle" font-size="11" fill="#5b6b7a">yes</text><rect x="522" y="212" width="418" height="66" rx="10" fill="#e6eefb" stroke="#0E7C86" stroke-width="1.4"/><text x="538" y="237" font-size="15" font-weight="700" fill="#0E7C86">SMALLTALK</text><text x="538" y="255" font-size="12.5" fill="#1c2530">Friendly reply. Never handed to a human.</text><text x="538" y="270" font-size="12.5" fill="#1c2530"></text><rect x="20" y="298" width="470" height="66" rx="10" fill="#f4f6f8" stroke="#c5d0d9" stroke-width="1.4"/><circle cx="46" cy="331.0" r="14" fill="#0E7C86"/><text x="46" y="336.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><text x="72" y="336.0" font-size="14" font-weight="600" fill="#1c2530">Asking for own balance, transactions or points?</text><line x1="255" y1="364" x2="255" y2="384" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="270" y="378" text-anchor="middle" font-size="11" fill="#5b6b7a">no</text><line x1="490" y1="331.0" x2="520" y2="331.0" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="505" y="323.0" text-anchor="middle" font-size="11" fill="#5b6b7a">yes</text><rect x="522" y="298" width="418" height="66" rx="10" fill="#e6eefb" stroke="#0E7C86" stroke-width="1.4"/><text x="538" y="323" font-size="15" font-weight="700" fill="#0E7C86">ACCOUNT</text><text x="538" y="341" font-size="12.5" fill="#1c2530">Needs a valid signed token and the tool turned on.</text><text x="538" y="356" font-size="12.5" fill="#1c2530">Otherwise HANDOFF.</text><rect x="20" y="384" width="470" height="66" rx="10" fill="#f4f6f8" stroke="#c5d0d9" stroke-width="1.4"/><circle cx="46" cy="417.0" r="14" fill="#0E7C86"/><text x="46" y="422.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text><text x="72" y="422.0" font-size="14" font-weight="600" fill="#1c2530">Problem words: rejected, failed, complaint?</text><line x1="255" y1="450" x2="255" y2="470" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="270" y="464" text-anchor="middle" font-size="11" fill="#5b6b7a">no</text><line x1="490" y1="417.0" x2="520" y2="417.0" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="505" y="409.0" text-anchor="middle" font-size="11" fill="#5b6b7a">yes</text><rect x="522" y="384" width="418" height="66" rx="10" fill="#fadedb" stroke="#b3372c" stroke-width="1.4"/><text x="538" y="409" font-size="15" font-weight="700" fill="#b3372c">HANDOFF</text><text x="538" y="427" font-size="12.5" fill="#1c2530">The bot cannot see the reason, so a human takes</text><text x="538" y="442" font-size="12.5" fill="#1c2530">over.</text><rect x="20" y="470" width="470" height="66" rx="10" fill="#f4f6f8" stroke="#c5d0d9" stroke-width="1.4"/><circle cx="46" cy="503.0" r="14" fill="#0E7C86"/><text x="46" y="508.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text><text x="72" y="499.0" font-size="14" font-weight="600" fill="#1c2530">Keywords: a topic word and a question word,</text><text x="72" y="517.0" font-size="14" font-weight="600" fill="#1c2530">anywhere in the sentence</text><line x1="255" y1="536" x2="255" y2="556" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="270" y="550" text-anchor="middle" font-size="11" fill="#5b6b7a">no</text><line x1="490" y1="503.0" x2="520" y2="503.0" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="505" y="495.0" text-anchor="middle" font-size="11" fill="#5b6b7a">yes</text><rect x="522" y="470" width="418" height="66" rx="10" fill="#e2f3e9" stroke="#1b7f4b" stroke-width="1.4"/><text x="538" y="495" font-size="15" font-weight="700" fill="#1b7f4b">ANSWER or CHOICE</text><text x="538" y="513" font-size="12.5" fill="#1c2530">One match gives the answer. Several matches, or</text><text x="538" y="528" font-size="12.5" fill="#1c2530">only a topic, show buttons.</text><rect x="20" y="556" width="470" height="66" rx="10" fill="#f4f6f8" stroke="#c5d0d9" stroke-width="1.4"/><circle cx="46" cy="589.0" r="14" fill="#0E7C86"/><text x="46" y="594.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">7</text><text x="72" y="594.0" font-size="14" font-weight="600" fill="#1c2530">An amount, like "cash 500" or "wd 100"?</text><line x1="255" y1="622" x2="255" y2="642" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="270" y="636" text-anchor="middle" font-size="11" fill="#5b6b7a">no</text><line x1="490" y1="589.0" x2="520" y2="589.0" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="505" y="581.0" text-anchor="middle" font-size="11" fill="#5b6b7a">yes</text><rect x="522" y="556" width="418" height="66" rx="10" fill="#e6eefb" stroke="#0E7C86" stroke-width="1.4"/><text x="538" y="581" font-size="15" font-weight="700" fill="#0E7C86">AMOUNT</text><text x="538" y="599" font-size="12.5" fill="#1c2530">Asks what the customer wants, or checks the</text><text x="538" y="614" font-size="12.5" fill="#1c2530">merchant's limits.</text><rect x="20" y="642" width="470" height="66" rx="10" fill="#f4f6f8" stroke="#c5d0d9" stroke-width="1.4"/><circle cx="46" cy="675.0" r="14" fill="#0E7C86"/><text x="46" y="680.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">8</text><text x="72" y="680.0" font-size="14" font-weight="600" fill="#1c2530">A topic this merchant has no entry for?</text><line x1="255" y1="708" x2="255" y2="728" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="270" y="722" text-anchor="middle" font-size="11" fill="#5b6b7a">no</text><line x1="490" y1="675.0" x2="520" y2="675.0" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="505" y="667.0" text-anchor="middle" font-size="11" fill="#5b6b7a">yes</text><rect x="522" y="642" width="418" height="66" rx="10" fill="#fadedb" stroke="#b3372c" stroke-width="1.4"/><text x="538" y="667" font-size="15" font-weight="700" fill="#b3372c">HANDOFF</text><text x="538" y="685" font-size="12.5" fill="#1c2530">Nothing to answer with, so a human takes over.</text><text x="538" y="700" font-size="12.5" fill="#1c2530"></text><rect x="20" y="728" width="470" height="66" rx="10" fill="#f4f6f8" stroke="#c5d0d9" stroke-width="1.4"/><circle cx="46" cy="761.0" r="14" fill="#0E7C86"/><text x="46" y="766.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">9</text><text x="72" y="766.0" font-size="14" font-weight="600" fill="#1c2530">Only a question word, like "how long?"</text><line x1="255" y1="794" x2="255" y2="814" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="270" y="808" text-anchor="middle" font-size="11" fill="#5b6b7a">no</text><line x1="490" y1="761.0" x2="520" y2="761.0" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="505" y="753.0" text-anchor="middle" font-size="11" fill="#5b6b7a">yes</text><rect x="522" y="728" width="418" height="66" rx="10" fill="#fdf0d4" stroke="#a86500" stroke-width="1.4"/><text x="538" y="753" font-size="15" font-weight="700" fill="#a86500">CLARIFY</text><text x="538" y="771" font-size="12.5" fill="#1c2530">Shows the matching questions as buttons.</text><text x="538" y="786" font-size="12.5" fill="#1c2530"></text><rect x="20" y="814" width="470" height="66" rx="10" fill="#f4f6f8" stroke="#c5d0d9" stroke-width="1.4"/><circle cx="46" cy="847.0" r="14" fill="#0E7C86"/><text x="46" y="852.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">10</text><text x="72" y="852.0" font-size="14" font-weight="600" fill="#1c2530">Similar to an example question? (0.72 answer, 0.45 ask)</text><line x1="255" y1="880" x2="255" y2="900" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="270" y="894" text-anchor="middle" font-size="11" fill="#5b6b7a">no</text><line x1="490" y1="847.0" x2="520" y2="847.0" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="505" y="839.0" text-anchor="middle" font-size="11" fill="#5b6b7a">yes</text><rect x="522" y="814" width="418" height="66" rx="10" fill="#e2f3e9" stroke="#1b7f4b" stroke-width="1.4"/><text x="538" y="839" font-size="15" font-weight="700" fill="#1b7f4b">ANSWER or CLARIFY</text><text x="538" y="857" font-size="12.5" fill="#1c2530">Compares with every example question of the</text><text x="538" y="872" font-size="12.5" fill="#1c2530">merchant.</text><rect x="20" y="900" width="470" height="66" rx="10" fill="#f4f6f8" stroke="#c5d0d9" stroke-width="1.4"/><circle cx="46" cy="933.0" r="14" fill="#0E7C86"/><text x="46" y="938.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">11</text><text x="72" y="929.0" font-size="14" font-weight="600" fill="#1c2530">Nothing matched: Claude picks an entry</text><text x="72" y="947.0" font-size="14" font-weight="600" fill="#1c2530">(only if switched on)</text><line x1="255" y1="966" x2="255" y2="986" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="270" y="980" text-anchor="middle" font-size="11" fill="#5b6b7a">no</text><line x1="490" y1="933.0" x2="520" y2="933.0" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><text x="505" y="925.0" text-anchor="middle" font-size="11" fill="#5b6b7a">yes</text><rect x="522" y="900" width="418" height="66" rx="10" fill="#e2f3e9" stroke="#1b7f4b" stroke-width="1.4"/><text x="538" y="925" font-size="15" font-weight="700" fill="#1b7f4b">ANSWER</text><text x="538" y="943" font-size="12.5" fill="#1c2530">Used only when Claude is at least 75% sure and the</text><text x="538" y="958" font-size="12.5" fill="#1c2530">entry exists.</text><rect x="20" y="986" width="470" height="66" rx="10" fill="#f4f6f8" stroke="#c5d0d9" stroke-width="1.4"/><circle cx="46" cy="1019.0" r="14" fill="#0E7C86"/><text x="46" y="1024.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">12</text><text x="72" y="1024.0" font-size="14" font-weight="600" fill="#1c2530">Still nothing</text><line x1="490" y1="1019.0" x2="520" y2="1019.0" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a)"/><rect x="522" y="986" width="418" height="66" rx="10" fill="#fdf0d4" stroke="#a86500" stroke-width="1.4"/><text x="538" y="1011" font-size="15" font-weight="700" fill="#a86500">ASK AGAIN, then HANDOFF</text><text x="538" y="1029" font-size="12.5" fill="#1c2530">Asks once with topic buttons. A second unclear</text><text x="538" y="1044" font-size="12.5" fill="#1c2530">message goes to a human.</text></svg>