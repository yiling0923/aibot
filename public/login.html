<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · LiveChat AI bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/admin.css">
<style>
  .login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .login .card{width:min(380px,100%);display:flex;flex-direction:column;gap:16px;padding:28px}
  .login h1{margin:0;font-size:20px;letter-spacing:-.01em}
  .login input{width:100%}
  .login .err{color:var(--bad);background:var(--badbg);border-radius:8px;padding:8px 10px;font-size:13px}
  .login form{display:flex;flex-direction:column;gap:14px}
</style>
</head>
<body>
<main class="login">
  <div class="card">
    <div class="brandwrap"><span class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 11h6M9 14h4"/></svg></span><div class="brand">Bot Control Panel<small>LiveChat AI bot</small></div></div>
    <h1>Sign in</h1>
    <form id="form">
      <label class="fld"><span>Username</span><input id="u" autocomplete="username" autocapitalize="none" required autofocus></label>
      <label class="fld"><span>Password</span><input id="p" type="password" autocomplete="current-password" required></label>
      <div class="err" id="err" hidden></div>
      <button class="btn pri" id="go" type="submit">Sign in</button>
    </form>
  </div>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  fetch('/api/auth/me').then((r) => (r.ok ? r.json() : null)).then((d) => { if (d && d.user) location.replace('/admin.html'); }).catch(() => {});
  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault(); $('#err').hidden = true; $('#go').disabled = true;
    try {
      const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: $('#u').value, password: $('#p').value }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Could not sign in.');
      location.replace('/admin.html');
    } catch (err) { $('#err').textContent = err.message; $('#err').hidden = false; $('#go').disabled = false; $('#p').select(); }
  });
</script>
</body>
</html>
