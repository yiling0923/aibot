<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveChat AI bot, control panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brandwrap"><span class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 11h6M9 14h4"/></svg></span><div class="brand">Bot Control Panel<small>LiveChat AI bot</small></div></div>
    <label class="fld merch"><span>Merchant</span><select id="merchant"></select><div class="merch-fixed" id="merchFixed" hidden></div></label>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <div class="whoami"><div><b id="whoName"></b><small id="whoRole"></small></div><button class="btn sm" id="signout" type="button">Sign out</button></div>
      <button class="btn sm ghost" id="mypw" data-pa="myPw" type="button">Change my password</button>
      <label class="switch" title="Show options most staff do not need, such as question types"><input type="checkbox" id="adv"><span class="track"><span class="thumb"></span></span><span class="swl">Advanced options</span></label>
    </div>
  </aside>
  <div class="content">
    <header class="topbar"><div class="vers" id="ver"></div><button class="btn pri" id="publish" type="button">Publish</button></header>
    <main class="main" id="main"></main>
  </div>
</div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>
<script src="/admin.js"></script>
</body>
</html>
