# Local database for the bot. Start it with:  docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16        # PostgreSQL 16 with the pgvector extension
    container_name: livechat-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: livechat_bot
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
volumes:
  dbdata:
